spring.application.name=Assignment1

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Use virtual threads for handling many concurrent blocking requests.
spring.threads.virtual.enabled=true

# Allow enough connections when many requests arrive at the same time.
server.tomcat.accept-count=300
server.tomcat.max-connections=10000
# Allow uploads for Whisper. API input limit is 25 MB.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
